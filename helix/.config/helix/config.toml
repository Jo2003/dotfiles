theme = "MyTheme"

[editor]
bufferline = "always"
cursorline = true
color-modes = true
true-color = true
end-of-line-diagnostics = "hint"
# Trim whitespace preceding line endings on write (default false)
trim-trailing-whitespace = true
# Trim extra line endings after the final one on write (default false)
trim-final-newlines = true
rulers = [120]
completion-replace = true

[editor.inline-diagnostics]
# Minimum severity to show a diagnostic on the primary cursor's line.
# Note that `cursor-line` diagnostics are hidden in insert mode.
cursor-line = "warning"
# Minimum severity to show a diagnostic on other lines:
# other-lines = "warning"

[editor.file-picker]
# hidden = false

[editor.indent-guides]
character = "╎"
render = true

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-name"]

[keys.normal]
tab = ["goto_next_buffer"]
S-tab = ["goto_previous_buffer"]
# "space" = { "m" = [ "save_selection", "select_all", ":pipe sed 's/[[:space:]]*$//'", "collapse_selection", "jump_backward", "commit_undo_checkpoint" ] }
